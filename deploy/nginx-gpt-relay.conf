# Add inside the roycanhelp.org 443 server block, next to the /admin/ locations.
# Rate zone goes in the http block (the existing rchatask/rchatlogin zones live in the same place).
#   limit_req_zone $binary_remote_addr zone=rchatgpt:1m rate=30r/m;
location /api/gpt/ {
  limit_req zone=rchatgpt burst=20 nodelay;
  add_header X-Robots-Tag "noindex, nofollow" always;
  proxy_pass http://127.0.0.1:8791/api/gpt/;
  proxy_http_version 1.1;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 60s;
  client_max_body_size 64k;
}
