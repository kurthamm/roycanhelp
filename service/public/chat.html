<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roy Can Help - Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #f5f1eb;
      --ink: #2c2c2c;
      --red: #8b0000;
      --yellow: #ffd700;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream: #2a2a28;
        --ink: #e8e4dc;
      }
    }

    body {
      font-family: Georgia, serif;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 1rem;
      border-bottom: 2px solid var(--red);
      background: var(--cream);
    }

    header h1 {
      font-size: 1.25rem;
      color: var(--red);
    }

    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 0;
    }

    .chat-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .workspace-column {
      display: none;
      width: 26rem;
      border-left: 2px solid #d4c9be;
      background: var(--cream);
      flex-direction: column;
      overflow: hidden;
    }

    .workspace-column.visible {
      display: flex;
    }

    @media (min-width: 1000px) {
      .workspace-column {
        display: flex;
      }
    }

    .transcript-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      padding: 0.75rem;
      border-radius: 4px;
      line-height: 1.6;
    }

    .message.user {
      background: rgba(139, 0, 0, 0.1);
      margin-left: 1rem;
      border-left: 3px solid var(--red);
    }

    .message.assistant {
      background: rgba(255, 215, 0, 0.05);
      margin-right: 1rem;
    }

    .message a {
      color: var(--red);
      text-decoration: underline;
      cursor: pointer;
    }

    .working {
      display: inline-block;
      font-style: italic;
      color: var(--red);
      opacity: 0.7;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .working.active {
      animation: pulse 1.5s ease-in-out infinite;
    }

    .input-area {
      padding: 1rem;
      border-top: 1px solid #d4c9be;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--cream);
    }

    .input-controls {
      display: flex;
      gap: 0.5rem;
    }

    textarea {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #d4c9be;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 1rem;
      resize: vertical;
      min-height: 80px;
      background: inherit;
      color: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.2);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      background: #6b0000;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .button-row {
      display: flex;
      gap: 0.5rem;
    }

    .button-row button {
      flex: 1;
    }

    .questions-empty {
      margin: 0;
      padding: 0.75rem 0.25rem;
      color: #5a5248;
      font-style: italic;
    }

    .questions-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      background: rgba(255, 215, 0, 0.02);
      overflow: hidden;
    }

    .questions-header {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      color: var(--red);
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    .questions-header:hover {
      opacity: 0.8;
    }

    .questions-count {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .questions-list {
      display: none;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
      flex: 1;
    }

    .questions-list.visible {
      display: flex;
    }

    .question-card {
      background: white;
      padding: 1.5rem;
      border-radius: 4px;
      border-left: 4px solid var(--yellow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .question-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .question-field label {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--red);
    }

    .question-textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d4c9be;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 1rem;
      min-height: 6rem;
      resize: vertical;
      background: inherit;
      color: inherit;
    }

    .question-textarea:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.2);
    }

    .question-status {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      display: none;
    }

    .question-status.saving {
      display: block;
      background: rgba(255, 215, 0, 0.3);
      color: #997700;
    }

    .question-status.saved {
      display: block;
      background: rgba(45, 106, 79, 0.2);
      color: #2d6a4f;
    }

    .question-status.error {
      display: block;
      background: rgba(139, 0, 0, 0.2);
      color: var(--red);
    }

    .question-meta {
      font-size: 0.85rem;
      color: #999;
    }

    .question-section-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .question-section-field select,
    .question-section-field input {
      padding: 0.5rem;
      border: 1px solid #d4c9be;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      background: inherit;
      color: inherit;
    }

    .question-section-field select:focus,
    .question-section-field input:focus {
      outline: none;
      border-color: var(--red);
    }

    .new-section-input {
      display: none;
      margin-top: 0.5rem;
    }

    .new-section-input.visible {
      display: block;
    }

    .question-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .answer-field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .answer-field label {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--red);
    }

    .answer-textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d4c9be;
      border-radius: 4px;
      font-family: Georgia, serif;
      font-size: 1rem;
      min-height: 8rem;
      resize: vertical;
      background: inherit;
      color: inherit;
    }

    .answer-textarea:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.2);
    }

    .answer-status {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      display: none;
    }

    .answer-status.drafting {
      display: block;
      background: rgba(255, 215, 0, 0.3);
      color: #997700;
    }

    .answer-status.saved {
      display: block;
      background: rgba(45, 106, 79, 0.2);
      color: #2d6a4f;
    }

    .answer-status.error {
      display: block;
      background: rgba(139, 0, 0, 0.2);
      color: var(--red);
    }

    .question-actions button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      flex: 0;
    }

    .question-actions .btn-publish {
      background: var(--red);
      font-weight: bold;
    }

    .question-actions .btn-redraft {
      background: #666;
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
    }

    .question-actions .btn-delete {
      background: #999;
    }

    @media (max-width: 600px) {
      .button-row {
        flex-direction: column;
      }

      .message.user {
        margin-left: 0;
      }

      .message.assistant {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Roy Can Help</h1>
  </header>

  <div class="main-container">
    <div class="chat-column">
      <div class="transcript-container" id="transcript"></div>
    </div>

    <div class="workspace-column" id="workspace-column">
      <div class="questions-panel" id="questions-panel">
        <div class="questions-header" id="questions-toggle">
          <span>Questions from visitors</span>
          <span class="questions-count" id="questions-badge">0</span>
        </div>
        <div class="questions-list" id="questions-list"></div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="message-input" placeholder="Tell me what to change on your site..." autofocus></textarea>
    <div class="button-row">
      <button id="attach-btn">📎 Attach</button>
      <button id="send-btn">Send</button>
      <button id="undo-btn">Undo last change</button>
    </div>
    <input type="file" id="file-input" style="display:none" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,application/rtf,application/vnd.oasis.opendocument.text">
  </div>

  <script>
    const transcript = document.getElementById('transcript');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const undoBtn = document.getElementById('undo-btn');
    const STORAGE_KEY = 'roy-chat-transcript';

    // Load transcript from localStorage
    function loadTranscript() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const messages = JSON.parse(stored);
          messages.forEach(msg => addMessageToDOM(msg.role, msg.text, false));
        } catch (e) {
          console.error('Failed to load transcript:', e);
        }
      }
    }

    // Save transcript to localStorage
    function saveTranscript() {
      const messages = [];
      document.querySelectorAll('.message').forEach(el => {
        const role = el.classList.contains('user') ? 'user' : 'assistant';
        const text = el.textContent;
        messages.push({ role, text });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    // Add message to DOM and render links
    function addMessageToDOM(role, text, save = true) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.innerHTML = linkifyText(escapeHtml(text));
      transcript.appendChild(msg);
      if (save) saveTranscript();
      transcript.scrollTop = transcript.scrollHeight;
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Convert URLs to clickable links
    function linkifyText(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, '<a href="$1" target="_blank">$1</a>');
    }

    // Send message
    async function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      // Save the message before clearing
      const userMessage = messageInput.value;
      messageInput.value = '';
      sendBtn.disabled = true;
      addMessageToDOM('user', msg);

      const working = document.createElement('div');
      working.className = 'message assistant';
      const span = document.createElement('span');
      span.className = 'working active';
      span.textContent = 'working…';
      working.appendChild(span);
      transcript.appendChild(working);

      try {
        // Get stored agent session ID
        const storedSessionId = localStorage.getItem('roy-agent-session-id');
        const response = await fetch('api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            ...(storedSessionId && { sessionId: storedSessionId }),
          }),
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        working.remove();
        let assistantText = '';
        let buffer = '';
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        // Parse SSE frames
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          buffer += chunk;

          // Process complete frames (separated by \n\n)
          const frames = buffer.split('\n\n');
          // Keep the last incomplete frame in buffer
          buffer = frames.pop() || '';

          for (const frame of frames) {
            if (!frame.trim()) continue;

            let eventType = 'text';
            let eventData = '';
            const lines = frame.split('\n');

            for (const line of lines) {
              if (line.startsWith('event: ')) {
                eventType = line.slice(7);
              } else if (line.startsWith('data: ')) {
                eventData = line.slice(6);
              }
            }

            if (eventType === 'text') {
              assistantText += eventData;
              if (assistantText && !assistantText.startsWith('working')) {
                transcript.querySelector('.working')?.remove?.();
              }
              // Update or create assistant message as we receive text
              let assistantMsg = transcript.querySelector('.message.assistant:last-of-type');
              if (!assistantMsg || assistantMsg.querySelector('.working')) {
                assistantMsg = document.createElement('div');
                assistantMsg.className = 'message assistant';
                transcript.appendChild(assistantMsg);
              }
              assistantMsg.innerHTML = linkifyText(escapeHtml(assistantText));
              transcript.scrollTop = transcript.scrollHeight;
            } else if (eventType === 'done') {
              try {
                const doneData = JSON.parse(eventData);
                if (doneData.sessionId) {
                  localStorage.setItem('roy-agent-session-id', doneData.sessionId);
                }
              } catch (e) {
                // Not JSON, skip
              }
            } else if (eventType === 'error') {
              addMessageToDOM('assistant', `Error: ${eventData}`);
            }
          }
        }

        // Process any remaining buffer data
        if (buffer.trim()) {
          const lines = buffer.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              assistantText += line.slice(6);
            }
          }
        }

        if (assistantText && !transcript.querySelector('.message.assistant:last-of-type')?.textContent?.trim()) {
          addMessageToDOM('assistant', assistantText);
        }
        transcript.querySelector('.working')?.remove?.();
      } catch (err) {
        // Connection failed - restore message and show error
        transcript.querySelector('.working')?.remove?.();
        messageInput.value = userMessage;
        addMessageToDOM('assistant', 'The connection dropped before that finished. Your message is still here, press Send to try again.');
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    // Undo last change
    async function undoLastChange() {
      if (!confirm('Undo last change? This will revert the last commit.')) return;

      try {
        const response = await fetch('api/undo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        if (response.ok) {
          const data = await response.json();
          addMessageToDOM('assistant', `Reverted: ${data.reverted}`);
        } else if (response.status === 409) {
          const error = await response.text();
          addMessageToDOM('assistant', `Cannot undo: ${error}`);
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (err) {
        addMessageToDOM('assistant', `Error: ${err.message}`);
      }
    }

    // Upload file (image or document)
    async function uploadFile(file) {
      const filename = file.name.toLowerCase().replace(/[^a-z0-9._-]/g, '-');
      const isImage = file.type.startsWith('image/');
      const chunks = [];
      const reader = file.stream().getReader();

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const buffer = await new Blob(chunks).arrayBuffer();

        const uploadRes = await fetch('api/upload', {
          method: 'POST',
          headers: { 'X-Filename': filename },
          body: new Uint8Array(buffer),
        });

        if (uploadRes.ok) {
          const data = await uploadRes.json();
          messageInput.value += `[uploaded: ${data.path}]\n`;

          if (isImage) {
            // Show thumbnail preview for images
            const reader2 = new FileReader();
            reader2.onload = (e) => {
              const preview = document.createElement('img');
              preview.src = e.target.result;
              preview.style.maxWidth = '200px';
              preview.style.maxHeight = '200px';
              preview.style.borderRadius = '4px';
              preview.style.marginTop = '0.5rem';
              const msg = document.createElement('div');
              msg.className = 'message user';
              msg.appendChild(preview);
              msg.innerHTML += `<br>[uploaded: ${data.path}]`;
              transcript.appendChild(msg);
              transcript.scrollTop = transcript.scrollHeight;
              saveTranscript();
            };
            reader2.readAsDataURL(file);
          } else {
            // Show filename chip for documents
            const msg = document.createElement('div');
            msg.className = 'message user';
            const chip = document.createElement('span');
            chip.style.display = 'inline-block';
            chip.style.background = 'rgba(139, 0, 0, 0.1)';
            chip.style.padding = '0.5rem 0.75rem';
            chip.style.borderRadius = '4px';
            chip.style.marginTop = '0.5rem';
            chip.innerHTML = `📄 ${filename}`;
            msg.appendChild(chip);
            msg.innerHTML += `<br>[uploaded: ${data.path}]`;
            transcript.appendChild(msg);
            transcript.scrollTop = transcript.scrollHeight;
            saveTranscript();
          }
        } else if (uploadRes.status === 409) {
          addMessageToDOM('assistant', 'Error: File already exists');
        } else {
          const error = await uploadRes.text();
          addMessageToDOM('assistant', `Error: ${error}`);
        }
      } catch (err) {
        addMessageToDOM('assistant', `Error: ${err.message}`);
      }
    }

    // Event listeners
    const attachBtn = document.getElementById('attach-btn');
    const fileInput = document.getElementById('file-input');

    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        uploadFile(e.target.files[0]);
        e.target.value = '';
      }
    });

    // Drag and drop
    transcript.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      transcript.style.opacity = '0.7';
    });

    transcript.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      transcript.style.opacity = '1';
    });

    transcript.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      transcript.style.opacity = '1';
      if (e.dataTransfer.files[0]) {
        uploadFile(e.dataTransfer.files[0]);
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    undoBtn.addEventListener('click', undoLastChange);

    // Load questions from queue
    async function loadQuestions() {
      try {
        const res = await fetch('api/questions');
        if (!res.ok) return;
        const questions = await res.json();

        const workspaceColumn = document.getElementById('workspace-column');
        const badge = document.getElementById('questions-badge');
        const list = document.getElementById('questions-list');

        badge.textContent = questions.length;
        list.innerHTML = '';

        if (questions.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'questions-empty';
          empty.textContent = 'No questions waiting. When someone asks one on the Ask Roy page, it shows up here.';
          list.appendChild(empty);
          workspaceColumn.classList.add('visible');
          list.classList.add('visible');
          return;
        }

        // Load wisdom sections
        let sections = [];
        try {
          const sectionsRes = await fetch('api/wisdom-sections');
          if (sectionsRes.ok) {
            sections = await sectionsRes.json();
          }
        } catch (e) {
          console.error('Failed to load wisdom sections:', e);
        }

        for (const q of questions) {
          const card = document.createElement('div');
          card.className = 'question-card';
          card.dataset.questionId = q.id;

          // Question textarea
          const questionField = document.createElement('div');
          questionField.className = 'question-field';
          const questionLabel = document.createElement('label');
          questionLabel.textContent = 'Question:';
          const questionTextarea = document.createElement('textarea');
          questionTextarea.className = 'question-textarea';
          questionTextarea.value = q.question;
          questionTextarea.dataset.originalValue = q.question;
          const questionStatus = document.createElement('div');
          questionStatus.className = 'question-status';
          questionField.appendChild(questionLabel);
          questionField.appendChild(questionTextarea);
          questionField.appendChild(questionStatus);
          card.appendChild(questionField);

          // Save on blur
          questionTextarea.addEventListener('blur', async () => {
            const newText = questionTextarea.value.trim();
            if (newText === questionTextarea.dataset.originalValue) return;
            if (!newText) {
              questionStatus.textContent = 'Question cannot be empty';
              questionStatus.className = 'question-status error';
              questionTextarea.value = questionTextarea.dataset.originalValue;
              return;
            }
            questionStatus.textContent = 'Saving...';
            questionStatus.className = 'question-status saving';
            try {
              const updateRes = await fetch('api/questions/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id, question: newText }),
              });
              if (updateRes.ok) {
                questionTextarea.dataset.originalValue = newText;
                questionStatus.textContent = 'Saved';
                questionStatus.className = 'question-status saved';
                setTimeout(() => {
                  if (questionStatus.className === 'question-status saved') {
                    questionStatus.className = 'question-status';
                  }
                }, 2000);
              } else {
                questionStatus.textContent = 'Failed to save';
                questionStatus.className = 'question-status error';
              }
            } catch (err) {
              questionStatus.textContent = 'Error: ' + err.message;
              questionStatus.className = 'question-status error';
            }
          });

          // Meta
          const meta = document.createElement('div');
          meta.className = 'question-meta';
          const date = new Date(q.ts).toLocaleDateString() + ' ' + new Date(q.ts).toLocaleTimeString();
          meta.textContent = 'Submitted: ' + date;
          card.appendChild(meta);

          // Answer field
          const answerField = document.createElement('div');
          answerField.className = 'answer-field';
          const answerLabel = document.createElement('label');
          answerLabel.textContent = 'Answer:';
          const answerTextarea = document.createElement('textarea');
          answerTextarea.className = 'answer-textarea';
          answerTextarea.value = q.draft || '';
          answerTextarea.dataset.originalValue = q.draft || '';
          const answerStatus = document.createElement('div');
          answerStatus.className = 'answer-status';
          answerField.appendChild(answerLabel);
          answerField.appendChild(answerTextarea);
          answerField.appendChild(answerStatus);
          card.appendChild(answerField);

          // If no draft exists, request one automatically when card renders
          if (!q.draft) {
            answerStatus.textContent = 'Drafting...';
            answerStatus.className = 'answer-status drafting';

            (async () => {
              try {
                const draftRes = await fetch('api/questions/draft', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ id: q.id }),
                });

                if (!draftRes.ok) {
                  answerStatus.textContent = 'Failed to draft answer';
                  answerStatus.className = 'answer-status error';
                  return;
                }

                let draftText = '';
                const reader = draftRes.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  const chunk = decoder.decode(value, { stream: true });
                  buffer += chunk;

                  // Process complete frames (separated by \n\n)
                  const frames = buffer.split('\n\n');
                  buffer = frames.pop() || '';

                  for (const frame of frames) {
                    if (!frame.trim()) continue;

                    let eventType = 'text';
                    let eventData = '';
                    const lines = frame.split('\n');

                    for (const line of lines) {
                      if (line.startsWith('event: ')) {
                        eventType = line.slice(7);
                      } else if (line.startsWith('data: ')) {
                        eventData = line.slice(6);
                      }
                    }

                    if (eventType === 'text') {
                      draftText += eventData;
                      answerTextarea.value = draftText;
                      answerTextarea.dataset.originalValue = draftText;
                    }
                  }
                }

                // Process remaining buffer
                if (buffer.trim()) {
                  const lines = buffer.split('\n');
                  for (const line of lines) {
                    if (line.startsWith('data: ')) {
                      draftText += line.slice(6);
                    }
                  }
                  answerTextarea.value = draftText;
                  answerTextarea.dataset.originalValue = draftText;
                }

                // Save the draft to the server
                if (draftText.trim()) {
                  const updateRes = await fetch('api/questions/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: q.id, draft: draftText }),
                  });
                  if (updateRes.ok) {
                    answerStatus.textContent = 'Draft ready';
                    answerStatus.className = 'answer-status saved';
                    setTimeout(() => {
                      if (answerStatus.className === 'answer-status saved') {
                        answerStatus.className = 'answer-status';
                      }
                    }, 2000);
                  }
                }
              } catch (err) {
                answerStatus.textContent = 'Error drafting: ' + err.message;
                answerStatus.className = 'answer-status error';
              }
            })();
          }

          // Save answer on blur
          answerTextarea.addEventListener('blur', async () => {
            const newText = answerTextarea.value.trim();
            if (newText === answerTextarea.dataset.originalValue) return;

            answerStatus.textContent = 'Saving...';
            answerStatus.className = 'answer-status saving';
            try {
              const updateRes = await fetch('api/questions/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id, draft: newText }),
              });
              if (updateRes.ok) {
                answerTextarea.dataset.originalValue = newText;
                answerStatus.textContent = 'Saved';
                answerStatus.className = 'answer-status saved';
                setTimeout(() => {
                  if (answerStatus.className === 'answer-status saved') {
                    answerStatus.className = 'answer-status';
                  }
                }, 2000);
              } else {
                answerStatus.textContent = 'Failed to save';
                answerStatus.className = 'answer-status error';
              }
            } catch (err) {
              answerStatus.textContent = 'Error: ' + err.message;
              answerStatus.className = 'answer-status error';
            }
          });

          // Wisdom section field
          const sectionField = document.createElement('div');
          sectionField.className = 'question-section-field';
          const sectionLabel = document.createElement('label');
          sectionLabel.textContent = 'Publish to section:';
          const sectionSelect = document.createElement('select');
          sectionSelect.value = q.section || '';
          sectionSelect.innerHTML = '<option value="">Select a section...</option>';
          for (const section of sections) {
            const option = document.createElement('option');
            option.value = section;
            option.textContent = section;
            if (q.section === section) option.selected = true;
            sectionSelect.appendChild(option);
          }
          const newSectionOption = document.createElement('option');
          newSectionOption.value = '__new__';
          newSectionOption.textContent = 'New section...';
          sectionSelect.appendChild(newSectionOption);
          sectionField.appendChild(sectionLabel);
          sectionField.appendChild(sectionSelect);

          const newSectionInput = document.createElement('input');
          newSectionInput.type = 'text';
          newSectionInput.placeholder = 'New section name';
          newSectionInput.className = 'new-section-input';
          sectionField.appendChild(newSectionInput);

          sectionSelect.addEventListener('change', () => {
            if (sectionSelect.value === '__new__') {
              newSectionInput.classList.add('visible');
              newSectionInput.focus();
            } else {
              newSectionInput.classList.remove('visible');
              // Save the section choice
              if (sectionSelect.value) {
                const updateRes = fetch('api/questions/update', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ id: q.id, section: sectionSelect.value }),
                });
              }
            }
          });

          card.appendChild(sectionField);

          // Actions
          const actions = document.createElement('div');
          actions.className = 'question-actions';

          const redraftBtn = document.createElement('button');
          redraftBtn.className = 'btn-redraft';
          redraftBtn.textContent = 'Redraft';
          redraftBtn.addEventListener('click', async () => {
            answerStatus.textContent = 'Drafting...';
            answerStatus.className = 'answer-status drafting';
            answerTextarea.value = '';
            answerTextarea.dataset.originalValue = '';

            try {
              const draftRes = await fetch('api/questions/draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id }),
              });

              if (!draftRes.ok) {
                answerStatus.textContent = 'Failed to draft';
                answerStatus.className = 'answer-status error';
                return;
              }

              let draftText = '';
              const reader = draftRes.body.getReader();
              const decoder = new TextDecoder();
              let buffer = '';

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                buffer += chunk;

                const frames = buffer.split('\n\n');
                buffer = frames.pop() || '';

                for (const frame of frames) {
                  if (!frame.trim()) continue;

                  let eventType = 'text';
                  let eventData = '';
                  const lines = frame.split('\n');

                  for (const line of lines) {
                    if (line.startsWith('event: ')) {
                      eventType = line.slice(7);
                    } else if (line.startsWith('data: ')) {
                      eventData = line.slice(6);
                    }
                  }

                  if (eventType === 'text') {
                    draftText += eventData;
                    answerTextarea.value = draftText;
                    answerTextarea.dataset.originalValue = draftText;
                  }
                }
              }

              if (buffer.trim()) {
                const lines = buffer.split('\n');
                for (const line of lines) {
                  if (line.startsWith('data: ')) {
                    draftText += line.slice(6);
                  }
                }
                answerTextarea.value = draftText;
                answerTextarea.dataset.originalValue = draftText;
              }

              if (draftText.trim()) {
                const updateRes = await fetch('api/questions/update', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ id: q.id, draft: draftText }),
                });
                if (updateRes.ok) {
                  answerStatus.textContent = 'Draft ready';
                  answerStatus.className = 'answer-status saved';
                  setTimeout(() => {
                    if (answerStatus.className === 'answer-status saved') {
                      answerStatus.className = 'answer-status';
                    }
                  }, 2000);
                }
              }
            } catch (err) {
              answerStatus.textContent = 'Error: ' + err.message;
              answerStatus.className = 'answer-status error';
            }
          });
          actions.appendChild(redraftBtn);

          const publishBtn = document.createElement('button');
          publishBtn.className = 'btn-publish';
          publishBtn.textContent = 'Publish to Wisdom';
          publishBtn.addEventListener('click', async () => {
            const selectedSection = sectionSelect.value;
            let sectionName = selectedSection;

            if (!selectedSection || selectedSection === '__new__') {
              sectionName = newSectionInput.value.trim();
              if (!sectionName) {
                alert('Please select or create a section');
                return;
              }
              // Save the new section
              await fetch('api/questions/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id, section: sectionName }),
              });
            }

            if (!answerTextarea.value.trim()) {
              alert('Please draft an answer first');
              return;
            }

            // Publish the question
            try {
              const publishRes = await fetch('api/questions/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id }),
              });

              if (publishRes.ok) {
                card.remove();
                const remaining = list.querySelectorAll('.question-card').length;
                if (remaining === 0) {
                  const empty = document.createElement('p');
                  empty.className = 'questions-empty';
                  empty.textContent = 'No questions waiting. When someone asks one on the Ask Roy page, it shows up here.';
                  list.appendChild(empty);
                  badge.textContent = '0';
                } else {
                  badge.textContent = remaining;
                }
              } else {
                const error = await publishRes.text();
                alert('Failed to publish: ' + error);
              }
            } catch (err) {
              alert('Error: ' + err.message);
            }
          });
          actions.appendChild(publishBtn);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'btn-delete';
          deleteBtn.textContent = 'Delete';
          deleteBtn.addEventListener('click', async () => {
            if (!confirm('Delete this question?')) return;
            try {
              const delRes = await fetch('api/questions/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: q.id }),
              });
              if (delRes.ok) {
                card.remove();
                const remaining = list.querySelectorAll('.question-card').length;
                if (remaining === 0) {
                  const empty = document.createElement('p');
                  empty.className = 'questions-empty';
                  empty.textContent = 'No questions waiting. When someone asks one on the Ask Roy page, it shows up here.';
                  list.appendChild(empty);
                  badge.textContent = '0';
                } else {
                  badge.textContent = remaining;
                }
              } else {
                alert('Failed to delete question');
              }
            } catch (err) {
              alert('Error: ' + err.message);
            }
          });
          actions.appendChild(deleteBtn);

          card.appendChild(actions);
          list.appendChild(card);
        }

        workspaceColumn.classList.add('visible');
        list.classList.add('visible');
      } catch (err) {
        console.error('Failed to load questions:', err);
      }
    }

    // Toggle questions panel
    document.getElementById('questions-toggle').addEventListener('click', () => {
      const list = document.getElementById('questions-list');
      list.classList.toggle('visible');
    });

    // Load transcript on page load
    loadTranscript();
    loadQuestions();
  </script>
</body>
</html>
